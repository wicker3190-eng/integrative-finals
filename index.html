    <script>
      function goto(id) {
        const el = document.getElementById(id);
        if (!el) return;
        const toolbarHeight = 100;
        const top = el.getBoundingClientRect().top + window.scrollY - toolbarHeight - 10;
        window.scrollTo({ top, behavior: 'smooth' });
      }
